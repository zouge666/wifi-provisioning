[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wifi-provisioning"
dynamic = ["version"]
description = "Offline Wi-Fi provisioning for headless Linux devices."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42",
    "websockets>=15,<17.2",
]

[project.scripts]
wifiprov = "wifiprov.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.6",
]

[tool.hatch.version]
path = "src/wifiprov/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wifiprov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Test data such as JSON samples reads better on one line.
"tests/*" = ["E501"]
