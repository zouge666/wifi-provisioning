name: CI

# Run on every push to main and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

# The job only reads the code, it never writes to the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    # Stop the job if a test hangs.
    timeout-minutes: 10
    strategy:
      # Let both Python versions finish, even if one of them fails.
      fail-fast: false
      matrix:
        # 3.10 is the oldest version we support, 3.12 is the one we develop on.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      # --locked fails the job if uv.lock does not match pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      # Node 22 runs TypeScript files directly, which is how the tests run.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # --ignore-scripts: nothing in the packages needs to run at install time.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check the types
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # The device has no Node, so the built page is part of the repository.
      - name: Check that the built page is up to date
        run: |
          npm run build
          git diff --exit-code -- ../src/wifiprov/web/app.js || { echo "Run npm run build in web/ and commit the result."; exit 1; }

      # The browser code talks to the real Python device over a WebSocket.
      - name: Install the Python side
        working-directory: .
        run: uv sync --locked

      - name: Run the end-to-end test
        run: npm run test:e2e

